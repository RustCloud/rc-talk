<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talk</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app">
      <aside id="side">
        <header id="side-head">
          <input id="search" type="search" autocomplete="off" />
        </header>
        <nav id="list"></nav>
        <div id="list-empty" hidden></div>
        <button id="new" type="button" class="fab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.2V20h2.8l8.3-8.3-2.8-2.8L4 17.2zm13.7-7.5a.75.75 0 0 0 0-1.06l-2.34-2.34a.75.75 0 0 0-1.06 0l-1.6 1.6 3.4 3.4 1.6-1.6z" /></svg>
        </button>
      </aside>

      <main id="chat">
        <div id="empty"><span></span></div>
        <header id="chat-head" hidden>
          <button id="back" type="button" class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z" /></svg>
          </button>
          <span id="chat-avatar" class="avatar"></span>
          <div class="who">
            <h1 id="chat-title"></h1>
            <div id="chat-sub"></div>
          </div>
          <button id="call" type="button" class="icon" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" /></svg>
          </button>
          <button id="more" type="button" class="icon" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2" /><circle cx="12" cy="12" r="2" /><circle cx="12" cy="19" r="2" /></svg>
          </button>
        </header>
        <div id="messages" hidden></div>
        <div id="editing" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17.2V20h2.8l8.3-8.3-2.8-2.8L4 17.2zm13.7-7.5a.75.75 0 0 0 0-1.06l-2.34-2.34a.75.75 0 0 0-1.06 0l-1.6 1.6 3.4 3.4 1.6-1.6z" /></svg>
          <div><b data-t="editingTitle"></b><span id="editing-text"></span></div>
          <button id="editing-cancel" type="button" class="icon">×</button>
        </div>
        <form id="compose" hidden>
          <textarea id="text" rows="1"></textarea>
          <button type="submit" id="send" class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z" /></svg>
          </button>
        </form>
        <div id="bar" hidden></div>
      </main>
    </div>

    <div id="menu" role="menu" hidden></div>
    <div id="toast" hidden></div>

    <dialog id="contact-dialog">
      <form method="dialog">
        <h2 data-t="newContact"></h2>
        <label><span data-t="username"></span><input name="username" required autocomplete="off" /></label>
        <p class="hint" data-t="contactHint"></p>
        <menu><button value="cancel" formnovalidate data-t="cancel"></button><button value="ok" data-t="ask"></button></menu>
      </form>
    </dialog>

    <dialog id="group-dialog">
      <form method="dialog">
        <h2 data-t="newGroup"></h2>
        <label><span data-t="groupTitle"></span><input name="title" required autocomplete="off" /></label>
        <div class="legend" data-t="members"></div>
        <div id="group-members"></div>
        <menu><button value="cancel" formnovalidate data-t="cancel"></button><button value="ok" data-t="create"></button></menu>
      </form>
    </dialog>

    <script src="/app-sdk.js"></script>
    <script src="app.js"></script>
  </body>
</html>
