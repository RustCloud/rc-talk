id = "rc-talk"
version = "0.1.0"
# The version of wit/app.wit.
api = "^0.2.18"
# What the administrator sees on the plugin's Status tab.
status = "/status"

[name]
en = "Talk"
ru = "Общение"

[permissions]
# Talk reads no files: attachments will go through the panel's share dialog
# (rustcloud.shareFile, see docs/design.md).
files = "none"
# LiveKit's API (RoomService), to take someone out of a call when the owner
# removes them from the group. The address comes from the setting below.
network = ["{livekit_api_url}"]

[ui]
icon = "chat"
entry = "/app/rc-talk"

# Until the core has jobs.add-for, messages travel through the plugin's
# storage on the server. Off by default, for the test bench only: a build with
# this setting never goes to the catalog. See docs/design.md, "Delivery".
[[server_settings]]
key = "storage_delivery"
kind = "bool"
label = { en = "Temporary delivery through the plugin's storage", ru = "Временная доставка через хранилище плагина" }
hint = { en = "Test bench only. Messages wait in the plugin's shared storage until the recipient opens Talk; the sender is set by the plugin, not the server.", ru = "Только для стенда. Сообщения ждут в общем хранилище плагина, пока получатель не откроет Talk; отправителя проставляет плагин, а не сервер." }

[[server_settings]]
key = "livekit_url"
kind = "text"
label = { en = "LiveKit address for browsers (wss://…)", ru = "Адрес LiveKit для браузеров (wss://…)" }

[[server_settings]]
key = "livekit_api_key"
kind = "text"
label = { en = "LiveKit API key", ru = "Ключ API LiveKit" }

[[server_settings]]
key = "livekit_api_secret"
kind = "secret"
label = { en = "LiveKit API secret", ru = "Секрет API LiveKit" }

[[server_settings]]
key = "livekit_api_url"
kind = "text"
label = { en = "LiveKit API address for the server (http(s)://…)", ru = "Адрес API LiveKit для сервера (http(s)://…)" }
hint = { en = "Optional, may be internal. Lets Talk take someone out of a call when they are removed from a group.", ru = "Необязательно, может быть внутренним. Нужен, чтобы убирать из звонка исключённого из группы." }
