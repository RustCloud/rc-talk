# Talk for RustCloud: chats between the cloud's users, calls through LiveKit.
# Build: cargo build --release --target wasm32-wasip2
[package]
name = "rc-talk"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
